# Builds the iPhone app on Codemagic's Macs (no Mac needed; free tier: 500 build minutes a month)
# and sends it to TestFlight. Setup steps: mobile/README, "iPhone builds without a Mac".
workflows:
  ios-testflight:
    name: iPhone app → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: F2R App Store Connect key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.floor2rafters.app
      node: 20
      xcode: latest
      cocoapods: default
      vars:
        APP_VERSION: "1.0.0"
        APP_STORE_APPLE_ID: "0000000000"   # App Store Connect → your app → App Information → Apple ID
    scripts:
      - name: Install
        script: cd mobile && npm install
      - name: Create the iPhone project
        script: cd mobile && npm run add:ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Version and build number
        script: |
          cd mobile/ios/App
          agvtool new-marketing-version $APP_VERSION
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0) + 1))
      - name: Build
        script: xcode-project build-ipa --workspace mobile/ios/App/App.xcworkspace --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

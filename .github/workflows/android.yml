# Builds the Android app in the cloud (free on GitHub). Run it from GitHub → Actions → "Android app" → Run workflow.
# You get two files under the run's Artifacts:
#   f2r-debug.apk   install straight on your own Android phone to test
#   f2r-release.aab upload to Google Play Console (only made once the signing secrets below are added)
# Secrets (GitHub → Settings → Secrets and variables → Actions), all optional until you need them:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS   signing for Google Play (mobile/README, "Android signing")
#   GOOGLE_SERVICES_JSON_BASE64                                               turns on phone notifications (mobile/README, "Notifications")
name: Android app
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the store, e.g. 1.0.1"
        required: true
        default: "1.0.0"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install
        run: npm install
      - name: Create the Android project
        run: npm run add:android
      - name: Notifications file (if added)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: if [ -n "$GS" ]; then echo "$GS" | base64 --decode > android/app/google-services.json; echo "Notifications on"; else echo "No GOOGLE_SERVICES_JSON_BASE64 secret, building without notifications"; fi
      - name: Version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ inputs.version }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Sign the Play Store bundle
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/f2r-debug.apk
          if [ -n "$KS" ]; then
            echo "$KS" | base64 --decode > release.jks
            cp android/app/build/outputs/bundle/release/app-release.aab out/f2r-release.aab
            jarsigner -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" out/f2r-release.aab "$KS_ALIAS"
            rm release.jks
          else
            echo "No signing secrets yet: only the test APK was made."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: f2r-android-${{ inputs.version }}
          path: mobile/out/*
